server {
  server_name	nerdsquad.xyz www.nerdsquad.xyz;
  root /var/www/nerdsquad.xyz;
  index index.html;

  gzip on;
  gzip_comp_level 3;
  gzip_types text/plain text/css application/javascript image/*;

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/nerdsquad.xyz/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/nerdsquad.xyz/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}
server {
    if ($host = www.nerdsquad.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = nerdsquad.xyz) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


  listen 80;
  listen [::]:80;
  server_name	nerdsquad.xyz www.nerdsquad.xyz;
    return 404; # managed by Certbot




}